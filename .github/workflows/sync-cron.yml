name: ServicePro Sync Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger incremental sync endpoint
        env:
          SYNC_BASE_URL: ${{ secrets.SERVICEPRO_SYNC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing required secrets: SERVICEPRO_SYNC_BASE_URL and/or CRON_SECRET"
            exit 1
          fi

          URL="${SYNC_BASE_URL%/}/api/cron/sync?mode=incremental"
          echo "Triggering ${URL}"

          for attempt in 1 2 3; do
            status_code="$(curl -sS -o response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${URL}" || true)"

            echo "Attempt ${attempt} -> HTTP ${status_code}"
            cat response.json || true

            if [ "${status_code}" = "200" ]; then
              echo "Sync trigger succeeded."
              exit 0
            fi

            sleep $((attempt * 10))
          done

          echo "Sync trigger failed after retries."
          exit 1
