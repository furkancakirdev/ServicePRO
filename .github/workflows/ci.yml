name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  kalite-kapisi:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Türkçe UI kalite kontrolü
        run: npm run check:tr-ui
